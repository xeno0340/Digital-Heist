name: digital_hiest
description: "A fun, interactive community event app for Digital Heist."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  confetti: ^0.7.0
  video_player: ^2.9.1
  video_player_web: ^2.3.3
  youtube_player_iframe: ^5.2.0
  url_launcher: ^6.3.0

  # State / Routing
  provider: ^6.1.2
  go_router: ^14.2.0

  # Local storage
  shared_preferences: ^2.3.3

  # Responsive layout helpers
  responsive_framework: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Make sure these paths exist; remove any that you aren't using.
  assets:
    - assets/poster.jpg
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/videos/round6.mp4
    - assets/round6_vault.jpg
